<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eef3f6">
<title>BM VISHAL SKY — Craftland IDs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="brand">BM <span>VISHAL SKY</span></div>
  <div class="tag">10K+ CRAFTLAND IDs</div>
</header>

<div class="search">
  <span>⌕</span><input id="q" placeholder="Search name, ID or ICON 🔎" autocomplete="off">
  <button id="clear" aria-label="Clear">×</button>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-cat="emote">Emotes</button>
  <button class="tab" data-cat="weapon">Weapon Skins</button>
  <button class="tab" data-cat="outfit">Outfit</button>
</div>

<div class="subbar">
  <span id="title">Emotes</span>
  <span id="count">Loading…</span>
</div>

<main id="grid" class="grid"></main>
<div id="loading" class="loading">Loading 10,000+ Free Fire item database…</div>
<div id="empty" class="empty" hidden>No items found.</div>

<div id="modal" class="modal" hidden>
  <div class="shade" id="closeShade"></div>
  <section class="sheet">
    <button class="x" id="close">×</button>
    <div class="preview"><img id="bigImg" alt=""></div>
    <h2 id="mName"></h2>
    <div class="mono"><b>ID:</b> <span id="mId"></span></div>
    <div class="mono"><b>ICON:</b> <span id="mIcon"></span></div>
    <div class="mono"><b>CATEGORY:</b> <span id="mCat"></span></div>
    <button id="copy" class="copy">COPY ID</button>
  </section>
</div>

<footer>BM VISHAL SKY · Craftland Creator Database</footer>
<script src="script.js"></script>
</body>
</html>
